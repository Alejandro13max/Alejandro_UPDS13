<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portafolio Minimalista | UPDS</title>
    
    <!-- PWA DESACTIVADA (Manifest comentado) -->
    <!-- <link rel="manifest" href="manifest.json"> -->
    <!-- <meta name="theme-color" content="#15161e"> -->
    
    <link rel="apple-touch-icon" href="img/foto1.jpg">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor Principal App (Modo PC / Móvil) -->
    <div class="app-container">
        
        <!-- Header Minimalista -->
        <header class="app-header">
            <div class="d-flex justify-content-between align-items-center w-100 px-3">
                <div class="logo"><i class="fas fa-code text-gengar"></i> ALE.UPDS</div>
                <span id="badgeEstadoRed" class="badge bg-success" style="font-size: 0.68rem;">
                    <i class="fas fa-wifi me-1"></i> Online
                </span>
            </div>
        </header>

        <!-- Contenido Dinámico (Pestañas) -->
        <main class="app-content">
            
            <!-- PESTAÑA 1: INICIO -->
            <section id="tab-inicio" class="tab-pane active">
                <div class="d-flex flex-column h-100 justify-content-center align-items-center text-center px-4">
                    
                    <!-- Carrusel de Fotos Locales (img/foto1.jpg, img/foto2.jpg, img/foto3.jpg) -->
                    <div id="carruselAvatar" class="carousel slide carousel-fade avatar-minimal mb-4" data-bs-ride="carousel" data-bs-interval="2800">
                        <div class="carousel-inner w-100 h-100">
                            <div class="carousel-item active w-100 h-100">
                                <img src="img/foto1.jpg" alt="Alejandro Foto 1" class="d-block w-100 h-100">
                            </div>
                            <div class="carousel-item w-100 h-100">
                                <img src="img/foto2.jpg" alt="Alejandro Foto 2" class="d-block w-100 h-100">
                            </div>
                            <div class="carousel-item w-100 h-100">
                                <img src="img/foto3.jpg" alt="Alejandro Foto 3" class="d-block w-100 h-100">
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carruselAvatar" data-bs-slide="prev" style="width: 26px; opacity: 0.4;">
                            <span class="carousel-control-prev-icon" aria-hidden="true" style="width: 12px; height: 12px;"></span>
                            <span class="visually-hidden">Anterior</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carruselAvatar" data-bs-slide="next" style="width: 26px; opacity: 0.4;">
                            <span class="carousel-control-next-icon" aria-hidden="true" style="width: 12px; height: 12px;"></span>
                            <span class="visually-hidden">Siguiente</span>
                        </button>
                    </div>

                    <h1 class="display-4 fw-bold mb-2 text-white">Hola, soy <br><span class="text-gengar">Alejandro</span></h1>
                    <p class="text-muted mb-5" style="max-width: 300px;">Desarrollador Web & Estudiante UPDS. Apasionado por el código limpio y el Futsal.</p>
                    
                    <!-- Clases semánticas mantenidas: .redes-contacto -->
                    <div class="d-flex gap-3">
                        <a href="#" class="redes-contacto"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="redes-contacto"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="redes-contacto"><i class="fab fa-whatsapp"></i></a>
                    </div>
                </div>
            </section>

            <!-- PESTAÑA 2: INTERESES -->
            <section id="tab-intereses" class="tab-pane">
                <div class="h-100 d-flex flex-column justify-content-center px-4">
                    <h2 class="section-title mb-4">Mis Intereses</h2>
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="minimal-card card-destacada tarjeta-item" data-nombre="Coding">
                                <i class="fas fa-code text-gengar mb-2 fs-4"></i>
                                <h6 class="text-white mb-0">Coding</h6>
                                <small class="text-muted">Web Dev</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="minimal-card card-destacada tarjeta-item" data-nombre="Futsal">
                                <i class="fas fa-futbol text-gengar mb-2 fs-4"></i>
                                <h6 class="text-white mb-0">Futsal</h6>
                                <small class="text-muted">Deporte</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="minimal-card card-destacada tarjeta-item" data-nombre="Gaming">
                                <i class="fas fa-gamepad text-gengar mb-2 fs-4"></i>
                                <h6 class="text-white mb-0">Gaming</h6>
                                <small class="text-muted">E-Sports</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="minimal-card card-destacada tarjeta-item" data-nombre="Música">
                                <i class="fas fa-music text-gengar mb-2 fs-4"></i>
                                <h6 class="text-white mb-0">Música</h6>
                                <small class="text-muted">Trap/HipHop</small>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- PESTAÑA 3: FAVORITOS (DOM) -->
            <section id="tab-favoritos" class="tab-pane">
                <div class="h-100 d-flex flex-column px-4 py-4 overflow-auto">
                    <h2 class="section-title mb-3">Favoritos</h2>
                    
                    <!-- Selector de Música Minimalista (Habilitados por defecto) -->
                    <div class="mb-3">
                        <label class="form-label text-muted small text-uppercase">Artista</label>
                        <select id="artista" class="form-select minimal-input">
                            <option value="">Seleccionar...</option>
                            <option value="duki">Duki</option>
                            <option value="cro">C.R.O</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small text-uppercase">Canción</label>
                        <select id="cancion" class="form-select minimal-input">
                            <option value="">Elige artista primero</option>
                        </select>
                        <div id="info-cancion" class="mt-2 text-gengar small fw-bold" style="display:none;"></div>
                    </div>

                    <!-- Filtro de Juegos Minimalista (Habilitados por defecto con Delegación) -->
                    <div class="mt-auto">
                        <label class="form-label text-muted small text-uppercase">Juegos</label>
                        <div class="d-flex gap-2 mb-3 overflow-auto pb-2" id="filtros-juegos">
                            <button class="btn btn-sm btn-outline-light rounded-pill filter-btn active" data-cat="todos">Todos</button>
                            <button class="btn btn-sm btn-outline-light rounded-pill filter-btn" data-cat="mmorpg">MMO</button>
                            <button class="btn btn-sm btn-outline-light rounded-pill filter-btn" data-cat="moba">MOBA</button>
                        </div>
                        <div id="contenedor-juegos" class="d-flex flex-column gap-2"></div>
                    </div>
                </div>
            </section>

            <!-- PESTAÑA 4: CONTACTO -->
            <section id="tab-contacto" class="tab-pane">
                <div class="h-100 d-flex flex-column justify-content-center px-4">
                    <h2 class="section-title mb-4">Contacto</h2>
                    <form id="contact-form" novalidate>
                        <div class="mb-3">
                            <input type="text" class="form-control minimal-input" id="nombre" placeholder="Nombre">
                            <small class="text-danger error-msg" id="error-nombre"></small>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control minimal-input" id="email" placeholder="Email">
                            <small class="text-danger error-msg" id="error-email"></small>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control minimal-input" id="mensaje" rows="2" placeholder="Mensaje"></textarea>
                            <small class="text-danger error-msg" id="error-mensaje"></small>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="terminos">
                            <label class="form-check-label text-muted small" for="terminos">Acepto términos</label>
                            <small class="text-danger error-msg d-block" id="error-terminos"></small>
                        </div>
                        <button type="submit" class="btn btn-gengar w-100 py-2">ENVIAR</button>
                        <div id="mensaje-exito" class="text-success text-center mt-2 small fw-bold" style="display:none;">¡Enviado con éxito!</div>
                    </form>
                </div>
            </section>

        </main>

        <!-- Barra de Navegación Inferior (App Style con Delegación de Eventos) -->
        <nav class="app-nav">
            <a href="#" class="nav-item active" data-target="tab-inicio">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="#" class="nav-item" data-target="tab-intereses">
                <i class="fas fa-star"></i>
                <span>Intereses</span>
            </a>
            <a href="#" class="nav-item" data-target="tab-favoritos">
                <i class="fas fa-heart"></i>
                <span>Favoritos</span>
            </a>
            <a href="#" class="nav-item" data-target="tab-contacto">
                <i class="fas fa-envelope"></i>
                <span>Contacto</span>
            </a>
        </nav>

    </div>

    <!-- Scripts: jQuery, Bootstrap y Script principal -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    
    <!-- PWA DESACTIVADA (Service Worker comentado) -->

                    .catch(err => console.log('SW error', err));
            });
        }
    </script> 
    -->
</body>
</html>
